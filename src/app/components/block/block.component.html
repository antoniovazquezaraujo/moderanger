<!--
El bloque raíz de `Part.blocks` puede ser contenido real (`.mr`) o un
contenedor vacío creado por la GUI. `treeValue` devuelve el propio bloque
cuando tiene contenido (PrimeNG anida sus hijos vía `children`) y sólo los
hijos cuando es un contenedor, preservando el comportamiento clásico.
-->
@if (treeValue.length > 0) {
  <p-tree
    [value]="treeValue"
    [draggableNodes]="true"
    [droppableNodes]="true"
    draggableScope="blocks"
    droppableScope="blocks"
    (mousedown)="onTreeMouseDown($event)"
    (dragstart)="onTreeDragStart($event)"
    (dragend)="onTreeDragEnd()"
    (onNodeDrop)="onNodeDrop($event)"
    [style]="{'height': 'auto', 'overflow-y': 'auto'}">
    <ng-template let-node pTemplate="default">
      @if (node.kind === 'reference') {
        <app-block-reference
          [reference]="node"
          [song]="song"
          (editDefinition)="editDefinition.emit($event)"
          (removeReference)="removeReference($event)"
          (duplicateReference)="duplicateReference($event)"
          (moveUp)="moveReference(node, -1)"
          (moveDown)="moveReference(node, 1)">
        </app-block-reference>
      } @else {
      <div class="block-content">
        <!-- Header: Contains drag handle, toggler, label, repetitions and controls.
        The root header can be hidden when a host (block library) owns it. -->
        @if (!hideHeader || node !== block) {
          <div class="block-header">
            <!-- Drag handle: the only point that starts a block drag -->
            @if (canDrag(node)) {
              <span
                class="header-item block-drag-handle"
                pTooltip="Drag to move block"
                [tooltipDisabled]="dragging"
                tooltipPosition="top"
                aria-hidden="true">
                <i class="pi pi-bars"></i>
              </span>
            }
            <!-- Remove p-treeToggler -->
            <!-- Add Toggle Button/Icon - Always visible -->
            <p-button
              [icon]="node.expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'"
              (click)="toggleNodeExpansion(node)"
              styleClass="p-button-text p-button-sm block-toggler-button">
            </p-button>
            <!-- Remove placeholder span -->
            @if (!hideLabel || node !== block) {
              <span class="header-item block-label"><input type="text" [(ngModel)]="node.label" class="block-name-input" placeholder="Block {{node.id}}" [attr.aria-label]="'Block name'"></span>
            }
            <span class="header-item repetitions-container">
              <span class="repetitions-label" style="margin-right: 2px; font-size: 12px;">×</span>
              <input type="number"
                id="repeatingTimes"
                class="repetitions-input"
                style="width:32px !important; max-width:32px !important;"
                [(ngModel)]="node.repeatingTimes"
                min="0" max="99" step="1"
                pTooltip="Repeats"
                tooltipPosition="top"
                [attr.aria-label]="'Repeats for block ' + node.label">
            </span>
            @if (!hideControls || node !== block) {
              <span class="header-item block-controls"><p-button (click)="addChild(node)" icon="pi pi-plus" pTooltip="Add Block" tooltipPosition="top"></p-button><p-button (click)="removeChild(node)" icon="pi pi-times" pTooltip="Remove Block" tooltipPosition="top"></p-button><p-button (click)="duplicateBlock(node)" icon="pi pi-copy" pTooltip="Duplicate Block" tooltipPosition="top"></p-button></span>
            }
          </div>
          } <!-- End of block-header -->
          <!-- Cuerpo del bloque: Notes + Commands + Operations (solo desplegado) -->
          @if ((forceExpanded && node === block) || node.expanded) {
            <div class="block-body">
              <!-- Notes: el editor de melodía vive ahora en el cuerpo -->
              <div class="block-section notes-section">
                <span class="block-section-icon" pTooltip="Notes" tooltipPosition="top" aria-label="Notes" role="img">&#9835;</span>
                <span class="melody-editor-inline-container">
                  <div class="melody-editor-container">
                    <div class="p-field p-col-12">
                      <app-melody-editor-wrapper
                        id="melody-{{node.id}}"
                        [(ngModel)]="node.blockContent.notes"
                        [blockId]="node.id"
                        [showVariableIcon]="false"
                        >
                      </app-melody-editor-wrapper>
                    </div>
                  </div>
                </span>
              </div>
              <app-block-commands
                [block]="node"
                >
              </app-block-commands>
            </div>
          }
        </div>
      }
      </ng-template>
      <!-- Add empty template to hide default toggler icon -->
      <ng-template pTemplate="togglericon"></ng-template>
    </p-tree>
    } <!-- Close the conditional container -->

  <!-- </div> -->
