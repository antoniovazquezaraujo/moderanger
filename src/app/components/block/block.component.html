<!--
Árbol de bloques estructurales: cada bloque es un nodo real. Las referencias
de contenido no son nodos: se muestran como chips en la cabecera y se editan
en el cuerpo con `app-block-content-links`.
-->
<p-tree
  [value]="treeValue"
  [draggableNodes]="true"
  [droppableNodes]="true"
  draggableScope="blocks"
  droppableScope="blocks"
  (mousedown)="onTreeMouseDown($event)"
  (dragstart)="onTreeDragStart($event)"
  (dragend)="onTreeDragEnd()"
  (onNodeDrop)="onNodeDrop($event)"
  [style]="{'height': 'auto', 'overflow-y': 'auto'}">
  <ng-template let-node pTemplate="default">
    <div class="block-content" [class.block-content--playing]="isBlockPlaying(node)">
      <div class="block-header">
        @if (canDrag(node)) {
          <span
            class="header-item block-drag-handle"
            pTooltip="Drag to move block"
            [tooltipDisabled]="dragging"
            tooltipPosition="top"
            aria-hidden="true">
            <i class="pi pi-bars"></i>
          </span>
        }
        <p-button
          [icon]="node.expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'"
          (click)="toggleNodeExpansion(node)"
          styleClass="p-button-text p-button-sm block-toggler-button">
        </p-button>
        <span class="header-item block-label">
          <input type="text"
            [(ngModel)]="node.label"
            class="block-name-input"
            placeholder="Block {{node.id}}"
            [attr.aria-label]="'Block name'">
        </span>

        <!-- Chips informativos de contenido: clic para navegar a la definición. -->
        @if (node.melody) {
          <button type="button"
            class="block-content-chip"
            [pTooltip]="'Edit melody ' + node.melody.label"
            tooltipPosition="top"
            (click)="navigateTo('melody', node.melody.label)">
            <i class="pi pi-volume-up" aria-hidden="true"></i>
            <span>{{ node.melody.label }}</span>
          </button>
        }
        @if (node.preset) {
          <button type="button"
            class="block-content-chip"
            [pTooltip]="'Edit preset ' + node.preset.label"
            tooltipPosition="top"
            (click)="navigateTo('preset', node.preset.label)">
            <i class="pi pi-sliders-h" aria-hidden="true"></i>
            <span>{{ node.preset.label }}</span>
          </button>
        }
        @if (node.procedure) {
          <button type="button"
            class="block-content-chip"
            [pTooltip]="'Edit procedure ' + node.procedure.label"
            tooltipPosition="top"
            (click)="navigateTo('procedure', node.procedure.label)">
            <i class="pi pi-bolt" aria-hidden="true"></i>
            <span>{{ node.procedure.label }}</span>
          </button>
        }

        <span class="header-item repetitions-container">
          <span class="repetitions-label" style="margin-right: 2px; font-size: 12px;">×</span>
          <input type="number"
            id="repeatingTimes"
            class="repetitions-input"
            style="width:32px !important; max-width:32px !important;"
            [(ngModel)]="node.repeatingTimes"
            min="0" max="99" step="1"
            pTooltip="Repeats"
            tooltipPosition="top"
            [attr.aria-label]="'Repeats for block ' + node.label">
        </span>
        <span class="header-item block-controls">
          <p-button (click)="addChild(node)" icon="pi pi-plus" pTooltip="Add Block" tooltipPosition="top"></p-button>
          <p-button (click)="removeChild(node)" icon="pi pi-times" pTooltip="Remove Block" tooltipPosition="top"></p-button>
          <p-button (click)="duplicateBlock(node)" icon="pi pi-copy" pTooltip="Duplicate Block" tooltipPosition="top"></p-button>
        </span>
      </div>

      @if (node.expanded) {
        <div class="block-body">
          <app-block-content-links
            [block]="node"
            [song]="song"
            (contentEdit)="contentEdit.emit($event)">
          </app-block-content-links>
        </div>
      }
    </div>
  </ng-template>
  <ng-template pTemplate="togglericon"></ng-template>
</p-tree>
