<!-- Las parts viven dentro del panel plegable Parts del song-editor; el
     scroll vertical lo gestiona .content-section (sin contenedor anidado). -->
<app-parts
    [parts]="getParts() || []"
    [song]="song"
    (onRemovePart)="emitRemovePart($event)"
    (onDuplicatePart)="handleDuplicatePart($event)"
    (editDefinitionEvent)="editDefinitionEvent.emit($event)">
</app-parts>
