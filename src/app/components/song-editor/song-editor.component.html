<div class="song-editor">
    <!-- Header moved here from SongComponent -->
    <div class="song-header">
        <div class="song-title-and-controls">
            <div class="song-title">
                <!-- Bind to song.name (Input property) -->
                <input type="text" [(ngModel)]="song.name" class="song-name-input" placeholder="Enter song name">
            </div>
            <div class="playback-controls">
                <div class="p-d-flex p-ai-center p-flex-nowrap">
                    <!-- Use methods from this component (SongEditorComponent) -->
                    <button pButton type="button" icon="pi pi-plus" (click)="addPart()" class="p-mr-2" pTooltip="Add Part" tooltipPosition="top"></button>
                    <span>Repeat:</span>
                    <!-- Repeticiones canónicas en Song.repeats (1-99 en la UI).
                         `ngModelChange` sincroniza el modelo MIENTRAS se escribe
                         (no solo al salir del campo), para que guardar/aplicar
                         usen siempre el valor visible. -->
                    <input type="number" id="repetitions" class="number-input" style="width:45px !important; max-width:45px !important;"
                           [ngModel]="song.repeats" (ngModelChange)="onRepeatsChange($event)" min="1" max="99" step="1"
                           pTooltip="Repeticiones de la canción" tooltipPosition="top" aria-label="Repeat">
                    <span class="p-ml-2">BPM:</span>
                    <!-- BPM canónico en Song.bpm (30-240, rango del formato .mr);
                         `ngModelChange` mantiene el modelo en sync al teclear. -->
                    <input type="number" id="bpm" class="number-input" style="width:52px !important; max-width:52px !important;"
                           [ngModel]="song.bpm" (ngModelChange)="onBpmChange($event)" min="30" max="240" step="1"
                           pTooltip="Tempo (BPM)" tooltipPosition="top" aria-label="BPM">
                    <button pButton type="button" icon="pi pi-play" (click)="playSong()" class="p-ml-2"></button>
                    <button pButton type="button" icon="pi pi-stop" (click)="stopSong()" class="p-ml-2"></button>
                    <!-- Dropdown para Default Duration -->
                    <select 
                        id="defaultDurationSelect" 
                        class="default-duration-select p-ml-2" 
                        [(ngModel)]="selectedDefaultDuration" 
                        (ngModelChange)="songPlayer.updateGlobalDefaultDuration($event)" 
                        pTooltip="Default Note Duration" 
                        tooltipPosition="top">
                        <option *ngFor="let dur of availableDurations" [value]="dur">{{dur}}</option>
                    </select>
                    <!-- Use metronome$ property of this component -->
                    <app-metronome class="inline-metronome p-ml-2"></app-metronome> 
                    <!-- Variables button next to metronome -->
                    <p-button (click)="toggleVariablesSidebar()" label="$" pTooltip="Show/Hide Variables" tooltipPosition="top" class="p-ml-2"></p-button>
                    <!-- Vista avanzada de texto .mr (divulgación progresiva) -->
                    <p-button (click)="toggleMrTextEditor()" label=".mr" icon="pi pi-code" pTooltip="Texto (.mr)" tooltipPosition="top" class="p-ml-2"></p-button>
                    <!-- Guardar/cargar el texto canónico como fichero .mr -->
                    <button pButton type="button" icon="pi pi-download" (click)="saveMrFile()" class="p-ml-2"
                            pTooltip="Guardar .mr (texto canónico)" tooltipPosition="top" aria-label="Guardar .mr"></button>
                    <button pButton type="button" icon="pi pi-upload" (click)="openMrFilePicker()" class="p-ml-2"
                            pTooltip="Cargar .mr" tooltipPosition="top" aria-label="Cargar .mr"></button>
                    <input #mrFileInput id="mrFileInput" class="mr-file-input" type="file"
                           accept=".mr,text/plain" (change)="onMrFileSelected($event)" aria-hidden="true" tabindex="-1" />
                </div>
            </div>
        </div>
    </div>

    <!-- Content section now only contains app-song (which will contain app-parts) -->
    <div class="content-section">
        <app-song 
            [song]="song" 
            (removePartEvent)="removePartFromSong($event)"
            (onDuplicatePartEvent)="duplicatePart($event)">
        </app-song>
    </div>

    <!-- Sidebar remains here, controlled by this component -->
    <p-sidebar [(visible)]="variablesSidebarVisible" position="right" styleClass="variables-sidebar">
        <h3>Variables</h3>
        <app-variable-declaration></app-variable-declaration>
    </p-sidebar>

    <!-- Vista avanzada de texto canónico .mr -->
    <app-mr-text-editor
        [song]="song"
        [(visible)]="mrTextVisible"
        (applied)="onMrTextApplied($event)">
    </app-mr-text-editor>

    <!-- Errores de guardar/cargar .mr: el modelo actual no se modifica -->
    <p-dialog
        [header]="mrErrorTitle"
        [(visible)]="mrErrorVisible"
        [modal]="true"
        [draggable]="false"
        [resizable]="false"
        [style]="{ width: '40rem', maxWidth: '95vw' }"
        styleClass="mr-error-dialog">
        <div class="mr-error-lines">
            <p class="mr-error-line" *ngFor="let line of mrErrorLines">{{ line }}</p>
        </div>
        <p class="mr-error-hint">La canción actual no se ha modificado.</p>
    </p-dialog>
</div>
