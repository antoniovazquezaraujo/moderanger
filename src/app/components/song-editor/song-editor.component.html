<div class="song-editor">
    <!-- Header moved here from SongComponent -->
    <div class="song-header" [class.song-header--playing]="isPlaying">
        <div class="song-title-and-controls">
            <div class="song-title">
                <span class="song-eyebrow">Now editing</span>
                <!-- Bind to song.name (Input property) -->
                <input type="text" [(ngModel)]="song.name" class="song-name-input" placeholder="Song title"
                       aria-label="Song title">
            </div>
            <div class="playback-controls">
                <div class="toolbar-group transport-group">
                    <!-- Play siempre reproduce desde el principio: si ya está
                         sonando, reinicia (stop + play interno) sin obligar a
                         pasar por el botón Stop. -->
                    <button pButton type="button" icon="pi pi-play" (click)="playSong()"
                            pTooltip="Play" tooltipPosition="top" aria-label="Play song"></button>
                    <button pButton type="button" icon="pi pi-stop" (click)="stopSong()"
                            pTooltip="Stop" tooltipPosition="top" aria-label="Stop song"></button>
                </div>

                <span class="toolbar-divider" aria-hidden="true"></span>

                <div class="toolbar-group">
                    <span class="toolbar-label">Repeat</span>
                    <!-- Repeticiones canónicas en Song.repeats (1-99 en la UI).
                         `ngModelChange` sincroniza el modelo MIENTRAS se escribe
                         (no solo al salir del campo), para que guardar/aplicar
                         usen siempre el valor visible. -->
                    <input type="number" id="repetitions" class="number-input"
                           [ngModel]="song.repeats" (ngModelChange)="onRepeatsChange($event)" min="1" max="99" step="1"
                           pTooltip="Repeticiones de la canción" tooltipPosition="top" aria-label="Repeat">
                </div>

                <div class="toolbar-group">
                    <span class="toolbar-label">BPM</span>
                    <!-- BPM canónico en Song.bpm (30-240, rango del formato .mr);
                         `ngModelChange` mantiene el modelo en sync al teclear. -->
                    <input type="number" id="bpm" class="number-input"
                           [ngModel]="song.bpm" (ngModelChange)="onBpmChange($event)" min="30" max="240" step="1"
                           pTooltip="Tempo (BPM)" tooltipPosition="top" aria-label="BPM">
                </div>

                <span class="toolbar-divider" aria-hidden="true"></span>

                <div class="toolbar-group">
                    <span class="toolbar-label">Duration</span>
                    <!-- Dropdown para Default Duration -->
                    <select
                        id="defaultDurationSelect"
                        class="default-duration-select"
                        [(ngModel)]="selectedDefaultDuration"
                        (ngModelChange)="songPlayer.updateGlobalDefaultDuration($event)"
                        pTooltip="Default Note Duration"
                        tooltipPosition="top">
                        <option *ngFor="let dur of availableDurations" [value]="dur">{{dur}}</option>
                    </select>
                </div>

                <!-- Use metronome$ property of this component -->
                <app-metronome class="inline-metronome"></app-metronome>

                <span class="toolbar-divider" aria-hidden="true"></span>

                <div class="toolbar-group toolbar-actions">
                    <!-- Vista avanzada de texto .mr (divulgación progresiva) -->
                    <button pButton type="button" icon="pi pi-file-o" (click)="toggleMrTextEditor()"
                            pTooltip="Texto (.mr)" tooltipPosition="top" aria-label="Texto (.mr)"></button>
                    <!-- Guardar/cargar el texto canónico como fichero .mr -->
                    <button pButton type="button" icon="pi pi-download" (click)="saveMrFile()"
                            pTooltip="Guardar .mr (texto canónico)" tooltipPosition="top" aria-label="Guardar .mr"></button>
                    <button pButton type="button" icon="pi pi-upload" (click)="openMrFilePicker()"
                            pTooltip="Cargar .mr" tooltipPosition="top" aria-label="Cargar .mr"></button>
                    <button pButton type="button" icon="pi pi-question-circle" label="Help"
                            (click)="toggleHelp()"
                            class="toolbar-help-button"
                            pTooltip="Help and quick guide" tooltipPosition="top"
                            aria-haspopup="dialog"
                            [attr.aria-expanded]="helpVisible"
                            aria-label="Help and quick guide"></button>
                    <input #mrFileInput id="mrFileInput" class="mr-file-input" type="file"
                           accept=".mr,text/plain" (change)="onMrFileSelected($event)" aria-hidden="true" tabindex="-1" />
                </div>
            </div>
        </div>
    </div>

    <!-- Contenido: panel de Variables (plegable, como una part más, encima
         de la fila) + la canción con sus parts. -->
    <div class="content-section">
        <div class="variables-panel">
            <div class="variables-panel-header" (click)="toggleVariablesPanel()">
                <p-button
                    [icon]="variablesExpanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'"
                    styleClass="p-button-text p-button-sm variables-panel-toggler">
                </p-button>
                <span class="variables-panel-title">Variables</span>
            </div>
            <div class="variables-panel-content" *ngIf="variablesExpanded">
                <app-variable-declaration></app-variable-declaration>
            </div>
        </div>
        <app-block-library [song]="song" #blockLibrary></app-block-library>
        <div class="parts-panel">
            <div class="parts-panel-header" (click)="togglePartsPanel()">
                <p-button
                    [icon]="partsExpanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'"
                    styleClass="p-button-text p-button-sm parts-panel-toggler"
                    [attr.aria-expanded]="partsExpanded"
                    aria-label="Toggle parts">
                </p-button>
                <span class="parts-panel-title">Parts</span>
                <span class="parts-panel-count" *ngIf="song.parts?.length">{{ song.parts.length }}</span>
                <p-button
                    class="parts-panel-add"
                    icon="pi pi-plus"
                    pTooltip="Add part"
                    tooltipPosition="top"
                    aria-label="Add part"
                    (click)="$event.stopPropagation(); addPart()">
                </p-button>
            </div>
            <div class="parts-panel-content" *ngIf="partsExpanded">
                <div class="parts-empty-state" *ngIf="!song.parts?.length">
                    <div class="empty-state-icon" aria-hidden="true">
                        <i class="pi pi-volume-up"></i>
                    </div>
                    <div class="empty-state-copy">
                        <h3>Start with a part</h3>
                        <p>A part is an instrument or voice. Add one, then create a block and write your first notes.</p>
                    </div>
                    <div class="empty-state-actions">
                        <button type="button" class="empty-primary" (click)="addPart()">Add a part</button>
                        <button type="button" class="empty-secondary" (click)="loadDemoSong()">Load example</button>
                    </div>
                </div>
                <app-song
                    [song]="song"
                    (removePartEvent)="removePartFromSong($event)"
                    (onDuplicatePartEvent)="duplicatePart($event)"
                    (editDefinitionEvent)="focusBlockDefinition($event)">
                </app-song>
            </div>
        </div>
    </div>

    <!-- Guía contextual para orientar al usuario sin salir del editor. -->
    <app-help-panel
        [(visible)]="helpVisible"
        (loadDemo)="loadDemoSong()">
    </app-help-panel>

    <!-- Vista avanzada de texto canónico .mr -->
    <app-mr-text-editor
        [song]="song"
        [(visible)]="mrTextVisible"
        (applied)="onMrTextApplied($event)">
    </app-mr-text-editor>

    <!-- Errores de guardar/cargar .mr: el modelo actual no se modifica -->
    <p-dialog
        [header]="mrErrorTitle"
        [(visible)]="mrErrorVisible"
        [modal]="true"
        [draggable]="false"
        [resizable]="false"
        [style]="{ width: '40rem', maxWidth: '95vw' }"
        styleClass="mr-error-dialog">
        <div class="mr-error-lines">
            <p class="mr-error-line" *ngFor="let line of mrErrorLines">{{ line }}</p>
        </div>
        <p class="mr-error-hint">La canción actual no se ha modificado.</p>
    </p-dialog>
</div>
