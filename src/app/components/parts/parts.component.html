<!-- Parts en fila horizontal (orden canción, izquierda → derecha) con
     splitter arrastrable entre parts adyacentes. El reparto inicial es igual
     (flex); tras el primer arrastre se fijan anchos explícitos en px y, si no
     caben, la fila hace scroll horizontal. -->
<div class="parts" [class.parts--dragging]="draggingIndex !== null">
    <ng-container *ngFor="let part of parts; let i = index; let last = last">
        <app-part
            [part]="part"
            [song]="song"
            [style.flex]="flexFor(i)"
            [style.width.px]="widthFor(i)"
            (onDuplicatePart)="handleDuplicatePart($event)"
            (onRemovePart)="removePart($event)"
            (editDefinitionEvent)="editDefinitionEvent.emit($event)">
        </app-part>
        <div *ngIf="!last"
             class="parts-splitter"
             [class.parts-splitter--dragging]="isDragging(i)"
             role="separator"
             aria-orientation="vertical"
             [attr.aria-label]="'Resize parts ' + (i + 1) + ' and ' + (i + 2)"
             tabindex="0"
             (pointerdown)="onSplitterPointerDown($event, i)"
             (pointermove)="onSplitterPointerMove($event)"
             (pointerup)="onSplitterPointerUp($event)"
             (pointercancel)="onSplitterPointerUp($event)"
             (dblclick)="resetWidths()"
             (keydown)="onSplitterKeydown($event, i)"></div>
    </ng-container>
</div>
