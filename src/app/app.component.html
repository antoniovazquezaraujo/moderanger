<div class="app-shell">
    <header class="app-topbar">
        <div class="brand" aria-label="Mode Ranger">
            <span class="brand-mark" aria-hidden="true">MR</span>
            <span class="brand-copy">
                <span class="brand-name">Mode Ranger</span>
                <span class="brand-tagline">Harmony studio</span>
            </span>
        </div>

        <div class="topbar-actions">
            <ng-container *ngIf="theme$ | async as theme">
                <button type="button"
                        class="theme-toggle"
                        (click)="toggleTheme()"
                        [attr.aria-label]="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
                        [title]="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'">
                    <i class="pi"
                       [ngClass]="theme === 'dark' ? 'pi-sun' : 'pi-moon'"
                       aria-hidden="true"></i>
                </button>
            </ng-container>

            <a class="topbar-link"
               href="https://antoniovazquezaraujo.github.io/moderanger/"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Open the Mode Ranger user guide">
                <i class="pi pi-book" aria-hidden="true"></i>
                <span>User guide</span>
                <i class="pi pi-arrow-up-right" aria-hidden="true"></i>
            </a>
        </div>
    </header>

    <div class="app-loading" *ngIf="!isAudioReady" role="status" aria-live="polite">
        <div class="loading-card">
            <span class="loading-orbit" aria-hidden="true"></span>
            <span class="loading-kicker">Warming up</span>
            <h2>Preparing the piano</h2>
            <p>Loading the instrument samples. This only takes a moment.</p>
        </div>
    </div>

    <main class="app-main" *ngIf="isAudioReady">
        <app-song-editor [(song)]="currentSong"></app-song-editor>
    </main>
</div>
